name: P2 Foundation CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: p2-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject forbidden tracked artifacts
        shell: bash
        run: |
          forbidden="$({
            git ls-files | grep -Ei '(^|/)\.env($|\.)|\.(pem|key|p12|pfx|dump|backup|bak|sqlite|sqlite3|db)$|(^|/)(node_modules|dist|\.venv|__pycache__)(/|$)' || true
          })"
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Enforce deferred governance scripts
        shell: bash
        run: |
          if [[ -n "$(git ls-files 'scripts/**')" ]]; then
            echo 'Root governance scripts require a separate alignment review.'
            exit 1
          fi

      - name: Enforce blocked P2 decisions
        shell: bash
        run: |
          if git grep -I -n -w -E 'family_delegation|health_fact_correction|health_fact_supersession|therapist_assignment|professional_service_fulfillment' -- backend/app frontend/src; then
            echo 'Decision-003, Decision-008, or Decision-009 implementation detected.'
            exit 1
          fi

  backend-unit:
    name: Backend Unit
    runs-on: ubuntu-latest
    env:
      KG_FILE_STORAGE_BACKEND: local_filesystem
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare unit private storage
        shell: bash
        run: |
          set -euo pipefail
          storage_root="$RUNNER_TEMP/kg-private-unit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$storage_root" in
            "$RUNNER_TEMP"/kg-private-unit-*) ;;
            *) echo 'Refusing an invalid unit private storage path.'; exit 1 ;;
          esac
          echo "::add-mask::$storage_root"
          echo "KG_PRIVATE_FILE_STORAGE_ROOT=$storage_root" >>"$GITHUB_ENV"
          if [[ -e "$storage_root" ]]; then
            echo 'Unit private storage path was not clean before setup.'
            exit 1
          fi
          install -d -m 700 "$storage_root"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install test dependencies
        run: |
          uv lock --check
          grep -Fq 'pytest-asyncio==1.4.0' pyproject.toml
          uv sync --frozen --all-groups --python 3.11.16
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Enforce Python lock and Ruff no-new-debt gates
        run: |
          uv run --frozen python -m pytest tests/test_工程质量Ruff与依赖锁门禁.py -q
          uv run --frozen ruff check app tests --select E9,F821

      - name: Generate process-only test secrets
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import os
          import secrets

          values = {
              "KG_DATABASE_PASSWORD": secrets.token_urlsafe(32),
              "KG_JWT_SECRET_KEY": secrets.token_urlsafe(64),
              "KG_AUTH_RATE_LIMIT_HMAC_KEY": secrets.token_urlsafe(64),
              "KG_SLICE5_CURSOR_SIGNING_KEY": secrets.token_urlsafe(64),
              "KG_SLICE7_CURSOR_SIGNING_KEY": secrets.token_urlsafe(64),
              "KG_SLICE5_PUBLIC_REFERENCE_HMAC_KEY": secrets.token_urlsafe(64),
              "KG_PRIVATE_FILE_ACCESS_SIGNING_KEY": secrets.token_urlsafe(48),
              "KG_ENV": "test",
              "KG_IDENTITY_PII_KEK_B64": base64.b64encode(secrets.token_bytes(32)).decode(),
              "KG_IDENTITY_PII_HMAC_KEY_B64": base64.b64encode(secrets.token_bytes(32)).decode(),
              "KG_IDENTITY_PII_KEY_ID": f"ci-{secrets.token_hex(8)}",
          }
          for value in values.values():
              print(f"::add-mask::{value}")
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              for name, value in values.items():
                  env_file.write(f"{name}={value}\n")
              env_file.write("KG_RUN_PG_INTEGRATION=0\n")
          PY

      - name: Run non-database regression
        run: python -m pytest tests --ignore=tests/integration --ignore=tests/uuid_validation -q --junitxml=pytest-report.xml

      - name: Scan unit signing material before artifact upload
        id: unit_signing_sensitive_scan
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          values = (
              os.environ.get("KG_SLICE5_CURSOR_SIGNING_KEY", ""),
              os.environ.get("KG_SLICE7_CURSOR_SIGNING_KEY", ""),
              os.environ.get("KG_SLICE5_PUBLIC_REFERENCE_HMAC_KEY", ""),
              os.environ.get("KG_PRIVATE_FILE_ACCESS_SIGNING_KEY", ""),
          )
          report = Path("pytest-report.xml").read_text(encoding="utf-8")
          if any(value and value in report for value in values):
              raise SystemExit("C1B_UNIT_SIGNING_MATERIAL_LEAK")
          PY

      - name: Record D1 toolchain evidence
        shell: bash
        run: |
          uv run --frozen python - <<'PY'
          import hashlib
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          lock_hash = hashlib.sha256(Path("uv.lock").read_bytes()).hexdigest().upper()
          fields = {
              "commit_sha": os.environ["GITHUB_SHA"],
              "python_exact_version": platform.python_version(),
              "python_cache_tag": sys.implementation.cache_tag,
              "uv_version": subprocess.check_output(["uv", "--version"], text=True).strip(),
              "ruff_version": subprocess.check_output(["ruff", "--version"], text=True).strip(),
              "pyproject_sha256": hashlib.sha256(Path("pyproject.toml").read_bytes()).hexdigest().upper(),
              "uv_lock_sha256": lock_hash,
              "resolution_graph_sha256": lock_hash,
              "ruff_baseline_sha256": hashlib.sha256(Path("ruff基线_V1.json").read_bytes()).hexdigest().upper(),
              "runner_os": os.environ.get("RUNNER_OS", "unknown"),
              "runner_image": os.environ.get("ImageOS", "unknown"),
              "runner_image_version": os.environ.get("ImageVersion", "unknown"),
              "uv_lock_check_exit": "0",
              "uv_sync_frozen_exit": "0",
              "ruff_gate_exit": "0",
              "pytest_exit": "0",
          }
          Path("d1-toolchain-evidence.txt").write_text(
              "".join(f"{name}={value}\n" for name, value in fields.items()),
              encoding="utf-8",
          )
          PY

      - name: Upload backend test report
        if: always() && steps.unit_signing_sensitive_scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-pytest-report
          path: |
            backend/pytest-report.xml
            backend/d1-toolchain-evidence.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Remove unit private storage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          case "${KG_PRIVATE_FILE_STORAGE_ROOT:-}" in
            "$RUNNER_TEMP"/kg-private-unit-*) rm -rf -- "$KG_PRIVATE_FILE_STORAGE_ROOT" ;;
            '') exit 0 ;;
            *) echo 'Refusing an invalid unit private storage cleanup path.'; exit 1 ;;
          esac
          test ! -e "$KG_PRIVATE_FILE_STORAGE_ROOT"

  backend-integration:
    name: Backend Integration
    needs: repository-safety
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      KG_RUN_PG_INTEGRATION: '1'
      KG_ALLOW_DESTRUCTIVE_TEST_DATABASE: '1'
      KG_TEST_ENVIRONMENT: ci_ephemeral
      KG_TEST_ROLE_SEPARATION: '1'
      KG_PRIVATE_FILE_SCANNER_FACTORY: tests.test_一期切片1私有文件Celery合同:create_ci_scanner
    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg16@sha256:61f891691050da6032023c01ea885730eeeba06b7c17b403e7d0b9c49c37dfe9
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.token }}
          TIMESCALEDB_TELEMETRY: off
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.7'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install test dependencies
        run: |
          uv lock --check
          grep -Fq 'pytest-asyncio==1.4.0' pyproject.toml
          uv sync --frozen --all-groups --python 3.11.16
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Prepare masked ephemeral integration configuration
        shell: bash
        env:
          KG_TEST_POSTGRES_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import secrets
          from urllib.parse import quote

          suffix = (
              f"{os.environ['GITHUB_RUN_ID']}_"
              f"{os.environ['GITHUB_RUN_ATTEMPT']}_"
              f"{secrets.token_hex(8)}"
          )
          host = "127.0.0.1"
          port = "5432"
          run_id = f"gh_{suffix}"
          database = f"kg_it_{run_id}"
          outbox_run_id = f"{run_id}_outbox"
          outbox_database = f"kg_it_{outbox_run_id}"
          roles = {
              "KG_TEST_DDL_OWNER_ROLE": f"kg_ci_ddl_owner_{suffix}",
              "KG_TEST_APPLICATION_ROLE": f"kg_ci_app_{suffix}",
              "KG_TEST_MIGRATION_ROLE": f"kg_ci_migration_{suffix}",
              "KG_TEST_READONLY_ROLE": f"kg_ci_readonly_{suffix}",
              "KG_TEST_VERIFICATION_WRITER_ROLE": f"kg_ci_writer_{suffix}",
              "KG_TEST_DELIVERY_WORKER_ROLE": f"kg_ci_worker_{suffix}",
              "KG_TEST_OUTBOX_AUDIT_ROLE": f"kg_ci_audit_{suffix}",
              "KG_TEST_HEALTH_FACT_WRITER_ROLE": f"kg_ci_fact_writer_{suffix}",
              "KG_TEST_ORGANIZATION_MAPPING_WRITER_ROLE": f"kg_ci_org_map_{suffix}",
              "KG_TEST_HEALTH_MAPPING_WRITER_ROLE": f"kg_ci_health_map_{suffix}",
              "KG_TEST_MAPPING_AUDIT_ROLE": f"kg_ci_map_audit_{suffix}",
              "KG_TEST_MAPPING_SHADOW_ROLE": f"kg_ci_map_shadow_{suffix}",
              "KG_TEST_ORGANIZATION_PROJECTION_BUILDER_ROLE": f"kg_ci_org_proj_{suffix}",
              "KG_TEST_HEALTH_PROJECTION_BUILDER_ROLE": f"kg_ci_health_proj_{suffix}",
              "KG_TEST_PROJECTION_CONFIRMATION_ROLE": f"kg_ci_proj_confirm_{suffix}",
              "KG_TEST_ORGANIZATION_PROJECTION_SHADOW_ROLE": f"kg_ci_org_shadow_{suffix}",
              "KG_TEST_HEALTH_PROJECTION_SHADOW_ROLE": f"kg_ci_health_shadow_{suffix}",
              "KG_TEST_PROJECTION_READY_GATE_ROLE": f"kg_ci_proj_ready_{suffix}",
              "KG_TEST_PROJECTION_SHADOW_CONFIRMATION_ROLE": f"kg_ci_shadow_confirm_{suffix}",
              "KG_TEST_ORGANIZATION_PROJECTION_READER_ROLE": f"kg_ci_org_reader_{suffix}",
              "KG_TEST_HEALTH_PROJECTION_READER_ROLE": f"kg_ci_health_reader_{suffix}",
              "KG_TEST_INSTITUTION_ONBOARDING_WRITER_ROLE": f"kg_ci_onboarding_writer_{suffix}",
              "KG_TEST_INSTITUTION_REVIEW_WRITER_ROLE": f"kg_ci_review_writer_{suffix}",
              "KG_TEST_PRIVATE_FILE_WRITER_ROLE": f"kg_ci_file_writer_{suffix}",
              "KG_TEST_PRIVATE_FILE_ACCESS_WRITER_ROLE": f"kg_ci_file_access_{suffix}",
              "KG_TEST_INSTITUTION_ONBOARDING_READER_ROLE": f"kg_ci_onboarding_reader_{suffix}",
              "KG_TEST_THERAPIST_ONBOARDING_WRITER_ROLE": f"kg_ci_therapist_onboarding_{suffix}",
              "KG_TEST_THERAPIST_REVIEW_WRITER_ROLE": f"kg_ci_therapist_review_{suffix}",
              "KG_TEST_THERAPIST_READINESS_WORKER_ROLE": f"kg_ci_therapist_worker_{suffix}",
              "KG_TEST_THERAPIST_READER_ROLE": f"kg_ci_therapist_reader_{suffix}",
              "KG_TEST_MEMBER_ENROLLMENT_WRITER_ROLE": f"kg_ci_member_enrollment_{suffix}",
              "KG_TEST_MEMBER_IDENTITY_REVIEW_WRITER_ROLE": f"kg_ci_member_review_{suffix}",
              "KG_TEST_MEMBER_CASE_WRITER_ROLE": f"kg_ci_member_case_{suffix}",
              "KG_TEST_MEMBER_WORKFLOW_WORKER_ROLE": f"kg_ci_member_worker_{suffix}",
              "KG_TEST_MEMBER_ENROLLMENT_READER_ROLE": f"kg_ci_member_reader_{suffix}",
              "KG_TEST_HEALTH_RECORD_WRITER_ROLE": f"kg_ci_health_record_{suffix}",
              "KG_TEST_ASSESSMENT_READINESS_WRITER_ROLE": f"kg_ci_readiness_{suffix}",
              "KG_TEST_SLICE4_WORKFLOW_WORKER_ROLE": f"kg_ci_slice4_worker_{suffix}",
              "KG_TEST_SLICE4_CLINICAL_READER_ROLE": f"kg_ci_clinical_reader_{suffix}",
              "KG_TEST_SLICE4_INSTITUTION_READER_ROLE": f"kg_ci_institution_reader_{suffix}",
              "KG_TEST_SLICE4_IDENTITY_AUTHORITY_ROLE": f"kg_ci_identity_authority_{suffix}",
              "KG_TEST_SLICE5_ASSESSMENT_WRITER_ROLE": f"kg_ci_slice5_assessment_{suffix}",
              "KG_TEST_SLICE5_RISK_WORKFLOW_WRITER_ROLE": f"kg_ci_slice5_risk_{suffix}",
              "KG_TEST_SLICE5_RULE_GOVERNANCE_WRITER_ROLE": f"kg_ci_slice5_rule_{suffix}",
              "KG_TEST_SLICE5_WORKFLOW_WORKER_ROLE": f"kg_ci_slice5_worker_{suffix}",
              "KG_TEST_SLICE5_CLINICAL_READER_ROLE": f"kg_ci_slice5_clinical_{suffix}",
              "KG_TEST_SLICE5_OVERSIGHT_READER_ROLE": f"kg_ci_slice5_oversight_{suffix}",
              "KG_TEST_SLICE6_INSTITUTION_WRITER_ROLE": f"kg_ci_slice6_institution_{suffix}",
              "KG_TEST_SLICE6_TEMPLATE_WRITER_ROLE": f"kg_ci_slice6_template_{suffix}",
              "KG_TEST_SLICE6_REVIEW_WRITER_ROLE": f"kg_ci_slice6_review_{suffix}",
              "KG_TEST_SLICE6_WORKFLOW_WORKER_ROLE": f"kg_ci_slice6_worker_{suffix}",
              "KG_TEST_SLICE6_CLINICAL_READER_ROLE": f"kg_ci_slice6_clinical_{suffix}",
              "KG_TEST_SLICE6_FAMILY_READER_ROLE": f"kg_ci_slice6_family_{suffix}",
              "KG_TEST_SLICE7_MILESTONE_WRITER_ROLE": f"kg_ci_slice7_milestone_{suffix}",
              "KG_TEST_SLICE7_CASE_WRITER_ROLE": f"kg_ci_slice7_case_{suffix}",
              "KG_TEST_SLICE7_TRANSFER_WRITER_ROLE": f"kg_ci_slice7_transfer_{suffix}",
              "KG_TEST_SLICE7_EXPORT_WORKER_ROLE": f"kg_ci_slice7_export_{suffix}",
              "KG_TEST_SLICE7_FAMILY_READER_ROLE": f"kg_ci_slice7_family_{suffix}",
              "KG_TEST_SLICE7_OVERSIGHT_READER_ROLE": f"kg_ci_slice7_oversight_{suffix}",
              "KG_TEST_A2_IDENTITY_INVENTORY_ROLE": f"kg_ci_a2_inventory_{suffix}",
              "KG_TEST_A2_IDENTITY_REMEDIATION_WRITER_ROLE": f"kg_ci_a2_remediation_writer_{suffix}",
              "KG_TEST_A2_IDENTITY_REMEDIATION_CONFIRMATION_ROLE": f"kg_ci_a2_remediation_confirm_{suffix}",
          }
          passwords = {
              name: secrets.token_urlsafe(48)
              for name in roles
              if name != "KG_TEST_DDL_OWNER_ROLE"
          }
          rabbit_suffix = secrets.token_hex(6)
          rabbit_user = f"kg_{secrets.token_hex(8)}"
          rabbit_password = secrets.token_urlsafe(48)
          values = {
              "KG_TEST_RUN_ID": run_id,
              "KG_DATABASE_HOST": host,
              "KG_DATABASE_PORT": port,
              "KG_DATABASE_NAME": database,
              "KG_OUTBOX_TEST_RUN_ID": outbox_run_id,
              "KG_OUTBOX_DATABASE_NAME": outbox_database,
              "KG_DATABASE_USER": roles["KG_TEST_APPLICATION_ROLE"],
              "KG_DATABASE_PASSWORD": passwords["KG_TEST_APPLICATION_ROLE"],
              "KG_JWT_SECRET_KEY": secrets.token_urlsafe(64),
              "KG_AUTH_RATE_LIMIT_HMAC_KEY": secrets.token_urlsafe(64),
              "KG_SLICE5_CURSOR_SIGNING_KEY": secrets.token_urlsafe(64),
              "KG_SLICE7_CURSOR_SIGNING_KEY": secrets.token_urlsafe(64),
              "KG_SLICE5_PUBLIC_REFERENCE_HMAC_KEY": secrets.token_urlsafe(64),
              "KG_ENV": "ci_ephemeral",
              "KG_IDENTITY_REVIEW_STEP_UP_SECRET_KEY": secrets.token_urlsafe(64),
              "KG_IDENTITY_PII_KEK_B64": base64.b64encode(
                  secrets.token_bytes(32)
              ).decode(),
              "KG_IDENTITY_PII_HMAC_KEY_B64": base64.b64encode(
                  secrets.token_bytes(32)
              ).decode(),
              "KG_IDENTITY_PII_KEY_ID": f"ci-{secrets.token_hex(8)}",
              "KG_ONBOARDING_PII_KEK_B64": base64.b64encode(
                  secrets.token_bytes(32)
              ).decode(),
              "KG_ONBOARDING_PII_HMAC_KEY_B64": base64.b64encode(
                  secrets.token_bytes(32)
              ).decode(),
              "KG_PRIVATE_FILE_ACCESS_SIGNING_KEY": secrets.token_urlsafe(48),
              "KG_THERAPIST_PII_ENCRYPTION_CURRENT_KEY_ID": f"ci-therapist-pii-{secrets.token_hex(6)}",
              "KG_THERAPIST_PII_DIGEST_CURRENT_KEY_ID": f"ci-therapist-digest-{secrets.token_hex(6)}",
              "KG_THERAPIST_TOTP_ENCRYPTION_CURRENT_KEY_ID": f"ci-therapist-totp-{secrets.token_hex(6)}",
              "KG_THERAPIST_INVITATION_CODE_HMAC_CURRENT_KEY_ID": f"ci-therapist-code-{secrets.token_hex(6)}",
              "KG_THERAPIST_REPLAY_ENCRYPTION_CURRENT_KEY_ID": f"ci-therapist-replay-{secrets.token_hex(6)}",
              "KG_THERAPIST_READINESS_DIGEST_CURRENT_KEY_ID": f"ci-therapist-ready-{secrets.token_hex(6)}",
              "KG_THERAPIST_DELIVERY_TARGET_HMAC_CURRENT_KEY_ID": f"ci-therapist-delivery-{secrets.token_hex(6)}",
              "KG_HEALTH_FACT_DIGEST_CURRENT_KEY_ID": "ci-k2",
              "KG_ORGANIZATION_MAPPING_DIGEST_CURRENT_KEY_ID": "ci-org-k2",
              "KG_RABBITMQ_CONTAINER_NAME": f"kg-reg-{rabbit_suffix}",
              "KG_RABBITMQ_NETWORK_NAME": f"kg-reg-{rabbit_suffix}-network",
              "KG_RABBITMQ_SENTINEL": f"kg-registration-disposable:{rabbit_suffix}",
              "KG_RABBITMQ_USER": rabbit_user,
              "KG_RABBITMQ_PASSWORD": rabbit_password,
              "KG_RUN_RABBITMQ_INTEGRATION": "1",
              "KG_RUN_SLICE1_CELERY_WORKER": "1",
              "KG_CELERY_TEST_RESULT_BACKEND": "rpc",
              **roles,
          }
          health_fact_keys = {
              "ci-k1": base64.b64encode(secrets.token_bytes(32)).decode(),
              "ci-k2": base64.b64encode(secrets.token_bytes(32)).decode(),
          }
          values["KG_HEALTH_FACT_DIGEST_KEYRING_JSON"] = json.dumps(
              health_fact_keys, separators=(",", ":"), sort_keys=True
          )
          organization_mapping_keys = {
              "ci-org-k1": base64.b64encode(secrets.token_bytes(32)).decode(),
              "ci-org-k2": base64.b64encode(secrets.token_bytes(32)).decode(),
          }
          values["KG_ORGANIZATION_MAPPING_DIGEST_KEYRING_JSON"] = json.dumps(
              organization_mapping_keys, separators=(",", ":"), sort_keys=True
          )
          organization_projection_keys = {
              "ci-org-proj-k1": base64.b64encode(secrets.token_bytes(32)).decode(),
              "ci-org-proj-k2": base64.b64encode(secrets.token_bytes(32)).decode(),
          }
          health_projection_keys = {
              "ci-health-proj-k1": base64.b64encode(secrets.token_bytes(32)).decode(),
              "ci-health-proj-k2": base64.b64encode(secrets.token_bytes(32)).decode(),
          }
          values["KG_ORGANIZATION_PROJECTION_DIGEST_CURRENT_KEY_ID"] = "ci-org-proj-k2"
          values["KG_ORGANIZATION_PROJECTION_DIGEST_KEYRING_JSON"] = json.dumps(organization_projection_keys, separators=(",", ":"), sort_keys=True)
          values["KG_HEALTH_PROJECTION_DIGEST_CURRENT_KEY_ID"] = "ci-health-proj-k2"
          values["KG_HEALTH_PROJECTION_DIGEST_KEYRING_JSON"] = json.dumps(health_projection_keys, separators=(",", ":"), sort_keys=True)
          member_enrollment_key_purposes = {
              "KG_MEMBER_ENROLLMENT_PII": "pii",
              "KG_MEMBER_ENROLLMENT_LOOKUP": "lookup",
              "KG_MEMBER_ENROLLMENT_CODE": "code",
              "KG_MEMBER_ENROLLMENT_REPLAY": "replay",
              "KG_MEMBER_ENROLLMENT_COORDINATION": "coordination",
              "KG_MEMBER_ENROLLMENT_REQUEST_DIGEST": "request",
              "KG_MEMBER_ENROLLMENT_AUDIT_DIGEST": "audit",
              "KG_MEMBER_ENROLLMENT_OUTBOX_DIGEST": "outbox",
              "KG_MEMBER_ENROLLMENT_CONSENT_DIGEST": "consent",
              "KG_MEMBER_ENROLLMENT_DELIVERY": "delivery",
          }
          member_enrollment_key_materials = {
              prefix: base64.b64encode(secrets.token_bytes(32)).decode()
              for prefix in member_enrollment_key_purposes
          }
          if len(
              {
                  *member_enrollment_key_materials.values(),
                  values["KG_IDENTITY_PII_HMAC_KEY_B64"],
              }
          ) != len(member_enrollment_key_materials) + 1:
              raise RuntimeError("Member enrollment key material is not isolated")
          for prefix, purpose in member_enrollment_key_purposes.items():
              key_id = f"ci-member-{purpose}-{secrets.token_hex(6)}"
              values[f"{prefix}_CURRENT_KEY_ID"] = key_id
              values[f"{prefix}_KEYRING_JSON"] = json.dumps(
