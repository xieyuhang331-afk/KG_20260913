          CREATE EXTENSION IF NOT EXISTS timescaledb;
          ALTER SCHEMA public OWNER TO :"ddl_owner_role";
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          SQL

      - name: Prepare isolated private storage
        shell: bash
        run: |
          set -euo pipefail
          storage_root="$RUNNER_TEMP/kg-slice7-private-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$storage_root" in
            "$RUNNER_TEMP"/kg-slice7-private-*) ;;
            *) echo 'Refusing an invalid private storage path.'; exit 1 ;;
          esac
          if [[ -e "$storage_root" ]]; then
            echo 'Private storage path was not clean before setup.'
            exit 1
          fi
          install -d -m 700 "$storage_root"
          echo "KG_FILE_STORAGE_BACKEND=local_filesystem" >>"$GITHUB_ENV"
          echo "KG_PRIVATE_FILE_STORAGE_ROOT=$storage_root" >>"$GITHUB_ENV"

      - name: Run PostgreSQL integration and migration tests
        run: >-
          python -m pytest tests/integration
          --ignore=tests/integration/test_身份注册持久发件箱数据库合同.py
          --ignore=tests/integration/test_一期切片7Outbox与RabbitMQ闭环.py
          --ignore=tests/integration/test_一期后端整改C2_3_Worker就绪RabbitMQ闭环.py
          -q --junitxml=pytest-integration-report.xml

      - name: Verify Slice 1 Celery worker cleanup
        shell: bash
        run: |
          set -euo pipefail
          if pgrep -f -- 'celery.*--hostname=slice1-ci@' >/dev/null; then
            echo 'Slice 1 Celery worker remained after the regular integration phase.'
            exit 1
          fi

      - name: Prepare independent Slice 7 worker
        shell: bash
        run: |
          set -euo pipefail
          worker_hostname="slice7-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@$(hostname)"
          echo 'KG_TEST_SLICE7_REAL_RABBIT=1' >>"$GITHUB_ENV"
          echo "KG_SLICE7_CI_WORKER_HOSTNAME=$worker_hostname" >>"$GITHUB_ENV"

      - name: Start independent Slice 7 Celery worker
        shell: bash
        run: |
          set -euo pipefail
          worker_pid_file="$RUNNER_TEMP/kg-slice7-worker.pid"
          worker_log="$RUNNER_TEMP/kg-slice7-worker.log"
          rm -f "$worker_pid_file" "$worker_log"
          nohup python -m celery -A app.tasks.celery_app:celery_app worker \
            -Q slice7-service-fulfillment-workflow \
            --hostname="$KG_SLICE7_CI_WORKER_HOSTNAME" \
            --pool=solo --concurrency=1 --loglevel=WARNING \
            --without-gossip --without-mingle --without-heartbeat \
            >"$worker_log" 2>&1 &
          worker_pid="$!"
          echo "$worker_pid" >"$worker_pid_file"
          worker_hostname="$KG_SLICE7_CI_WORKER_HOSTNAME"
          worker_ready="false"
          for _ in $(seq 1 30); do
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              echo 'Independent Slice 7 Celery worker exited before readiness.'
              exit 1
            fi
            if python scripts/check_worker_readiness.py \
              --worker-kind slice7 \
              --hostname "$worker_hostname" \
              >"$RUNNER_TEMP/kg-slice7-ping.log" 2>&1 \
              && grep -F -- '"status":"READY"' "$RUNNER_TEMP/kg-slice7-ping.log" >/dev/null; then
              worker_ready="true"
              break
            fi
            sleep 1
          done
          if [[ "$worker_ready" != "true" ]] || ! kill -0 "$worker_pid" 2>/dev/null; then
            echo 'Independent Slice 7 Celery worker is unavailable.'
            exit 1
          fi

      - name: Run Slice 7 RabbitMQ and independent worker contract
        run: >-
          python -m pytest
          tests/integration/test_一期切片7Outbox与RabbitMQ闭环.py
          -q --junitxml=pytest-slice7-rabbit-report.xml

      - name: Run Slice 7 product readiness probe
        env:
