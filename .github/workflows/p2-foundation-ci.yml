          -q --junitxml=pytest-c23-slice7-readiness-report.xml

      - name: Stop independent Slice 7 Celery worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          worker_pid_file="$RUNNER_TEMP/kg-slice7-worker.pid"
          if [[ -f "$worker_pid_file" ]]; then
            worker_pid="$(cat "$worker_pid_file")"
            if [[ "$worker_pid" =~ ^[0-9]+$ ]] && kill -0 "$worker_pid" 2>/dev/null; then
              kill "$worker_pid"
              for _ in $(seq 1 20); do
                if ! kill -0 "$worker_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              if kill -0 "$worker_pid" 2>/dev/null; then
                kill -KILL "$worker_pid"
              fi
              wait "$worker_pid" 2>/dev/null || true
            fi
          fi
          rm -f "$worker_pid_file" \
            "$RUNNER_TEMP/kg-slice7-worker.log" \
            "$RUNNER_TEMP/kg-slice7-ping.log"
          storage_root="${KG_PRIVATE_FILE_STORAGE_ROOT:-}"
          case "$storage_root" in
            "$RUNNER_TEMP"/kg-slice7-private-*) rm -rf -- "$storage_root" ;;
            '') ;;
            *) echo 'Refusing an invalid Slice 7 private storage cleanup path.'; exit 1 ;;
          esac

