          CREATE ROLE :"slice7_case_role" LOGIN PASSWORD :'slice7_case_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE :"slice7_transfer_role" LOGIN PASSWORD :'slice7_transfer_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE :"slice7_export_role" LOGIN PASSWORD :'slice7_export_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE :"slice7_family_role" LOGIN PASSWORD :'slice7_family_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE :"slice7_oversight_role" LOGIN PASSWORD :'slice7_oversight_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE :"a2_identity_inventory_role" LOGIN PASSWORD :'a2_identity_inventory_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
