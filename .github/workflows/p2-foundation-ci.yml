name: P2 Foundation CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: p2-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject forbidden tracked artifacts
        shell: bash
        run: |
          forbidden="$({
            git ls-files | grep -Ei '(^|/)\.env($|\.)|\.(pem|key|p12|pfx|dump|backup|bak|sqlite|sqlite3|db)$|(^|/)(node_modules|dist|\.venv|__pycache__)(/|$)' || true
          })"
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Enforce deferred governance scripts
        shell: bash
        run: |
          if [[ -n "$(git ls-files 'scripts/**')" ]]; then
            echo 'Root governance scripts require a separate alignment review.'
            exit 1
          fi

      - name: Enforce blocked P2 decisions
        shell: bash
        run: |
          if git grep -I -n -E 'family_delegation|health_fact_correction|health_fact_supersession|therapist_assignment|professional_service_fulfillment' -- backend/app frontend/src; then
            echo 'Decision-003, Decision-008, or Decision-009 implementation detected.'
            exit 1
          fi

  backend-unit:
    name: Backend Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e . pytest==9.1.1

      - name: Generate process-only test secrets
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import os
          import secrets

          values = {
              "KG_DATABASE_PASSWORD": secrets.token_urlsafe(32),
              "KG_JWT_SECRET_KEY": secrets.token_urlsafe(64),
              "KG_IDENTITY_PII_KEK_B64": base64.b64encode(secrets.token_bytes(32)).decode(),
              "KG_IDENTITY_PII_HMAC_KEY_B64": base64.b64encode(secrets.token_bytes(32)).decode(),
              "KG_IDENTITY_PII_KEY_ID": f"ci-{secrets.token_hex(8)}",
          }
          for value in values.values():
              print(f"::add-mask::{value}")
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              for name, value in values.items():
                  env_file.write(f"{name}={value}\n")
              env_file.write("KG_RUN_PG_INTEGRATION=0\n")
          PY

      - name: Run non-database regression
        run: python -m pytest tests --ignore=tests/integration --ignore=tests/uuid_validation -q --junitxml=pytest-report.xml

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: warn
          retention-days: 14

  backend-integration:
    name: Backend Integration
    needs: repository-safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      KG_RUN_PG_INTEGRATION: '1'
      KG_ALLOW_DESTRUCTIVE_TEST_DATABASE: '1'
      KG_TEST_ENVIRONMENT: ci_ephemeral
      KG_TEST_ROLE_SEPARATION: '1'
    services:
      timescaledb:
        image: timescale/timescaledb:2.28.3-pg16@sha256:61f891691050da6032023c01ea885730eeeba06b7c17b403e7d0b9c49c37dfe9
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.token }}
          TIMESCALEDB_TELEMETRY: off
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e . pytest==9.1.1

      - name: Prepare masked ephemeral integration configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          import secrets
          from urllib.parse import quote

          suffix = (
              f"{os.environ['GITHUB_RUN_ID']}_"
              f"{os.environ['GITHUB_RUN_ATTEMPT']}_"
              f"{secrets.token_hex(8)}"
          )
          host = "127.0.0.1"
          port = "5432"
          run_id = f"gh_{suffix}"
          database = f"kg_it_{run_id}"
          outbox_run_id = f"{run_id}_outbox"
          outbox_database = f"kg_it_{outbox_run_id}"
          roles = {
              "KG_TEST_DDL_OWNER_ROLE": f"kg_ci_ddl_owner_{suffix}",
              "KG_TEST_APPLICATION_ROLE": f"kg_ci_app_{suffix}",
              "KG_TEST_MIGRATION_ROLE": f"kg_ci_migration_{suffix}",
              "KG_TEST_READONLY_ROLE": f"kg_ci_readonly_{suffix}",
              "KG_TEST_VERIFICATION_WRITER_ROLE": f"kg_ci_writer_{suffix}",
              "KG_TEST_DELIVERY_WORKER_ROLE": f"kg_ci_worker_{suffix}",
              "KG_TEST_OUTBOX_AUDIT_ROLE": f"kg_ci_audit_{suffix}",
          }
          passwords = {
              name: secrets.token_urlsafe(48)
              for name in roles
              if name != "KG_TEST_DDL_OWNER_ROLE"
          }
          rabbit_suffix = secrets.token_hex(6)
          rabbit_user = f"kg_{secrets.token_hex(8)}"
          rabbit_password = secrets.token_urlsafe(48)
          values = {
              "KG_TEST_RUN_ID": run_id,
              "KG_DATABASE_HOST": host,
              "KG_DATABASE_PORT": port,
              "KG_DATABASE_NAME": database,
              "KG_OUTBOX_TEST_RUN_ID": outbox_run_id,
              "KG_OUTBOX_DATABASE_NAME": outbox_database,
              "KG_DATABASE_USER": roles["KG_TEST_APPLICATION_ROLE"],
              "KG_DATABASE_PASSWORD": passwords["KG_TEST_APPLICATION_ROLE"],
              "KG_JWT_SECRET_KEY": secrets.token_urlsafe(64),
              "KG_IDENTITY_REVIEW_STEP_UP_SECRET_KEY": secrets.token_urlsafe(64),
              "KG_IDENTITY_PII_KEK_B64": base64.b64encode(
                  secrets.token_bytes(32)
              ).decode(),
              "KG_IDENTITY_PII_HMAC_KEY_B64": base64.b64encode(
                  secrets.token_bytes(32)
              ).decode(),
              "KG_IDENTITY_PII_KEY_ID": f"ci-{secrets.token_hex(8)}",
              "KG_RABBITMQ_CONTAINER_NAME": f"kg-reg-{rabbit_suffix}",
              "KG_RABBITMQ_NETWORK_NAME": f"kg-reg-{rabbit_suffix}-network",
              "KG_RABBITMQ_SENTINEL": f"kg-registration-disposable:{rabbit_suffix}",
              "KG_RABBITMQ_USER": rabbit_user,
              "KG_RABBITMQ_PASSWORD": rabbit_password,
              "KG_RUN_RABBITMQ_INTEGRATION": "1",
              "KG_CELERY_TEST_RESULT_BACKEND": "rpc",
              **roles,
          }
          url_names = {
              "KG_TEST_DATABASE_URL": "KG_TEST_APPLICATION_ROLE",
              "KG_TEST_MIGRATION_DATABASE_URL": "KG_TEST_MIGRATION_ROLE",
              "KG_TEST_READONLY_DATABASE_URL": "KG_TEST_READONLY_ROLE",
              "KG_TEST_VERIFICATION_WRITER_DATABASE_URL": "KG_TEST_VERIFICATION_WRITER_ROLE",
              "KG_TEST_DELIVERY_WORKER_DATABASE_URL": "KG_TEST_DELIVERY_WORKER_ROLE",
              "KG_TEST_OUTBOX_AUDIT_DATABASE_URL": "KG_TEST_OUTBOX_AUDIT_ROLE",
          }
          for environment_name, role_name in url_names.items():
              role = roles[role_name]
              password = passwords[role_name]
              values[environment_name] = (
                  f"postgresql+asyncpg://{role}:{quote(password)}@"
                  f"{host}:{port}/{database}"
              )
              values[f"KG_OUTBOX_{environment_name}"] = (
                  f"postgresql+asyncpg://{role}:{quote(password)}@"
                  f"{host}:{port}/{outbox_database}"
              )
          values["KG_IDENTITY_APPLICATION_DATABASE_URL"] = values[
              "KG_TEST_DATABASE_URL"
          ]
          values["KG_VERIFICATION_WRITER_DATABASE_URL"] = values[
              "KG_TEST_VERIFICATION_WRITER_DATABASE_URL"
          ]
          values["KG_DELIVERY_WORKER_DATABASE_URL"] = values[
              "KG_TEST_DELIVERY_WORKER_DATABASE_URL"
          ]
          for value in (
              *values.values(),
              *passwords.values(),
              rabbit_user,
              rabbit_password,
          ):
              print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in values.items():
                  env_file.write(f"{name}={value}\n")
              for role_name, password in passwords.items():
                  env_file.write(f"{role_name}_PASSWORD={password}\n")
          PY

      - name: Start disposable RabbitMQ
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$KG_RABBITMQ_CONTAINER_NAME" =~ ^kg-reg-[0-9a-f]{12}$ ]]; then
            echo 'Refusing an invalid disposable RabbitMQ container name.'
            exit 1
          fi
          if [[ "$KG_RABBITMQ_NETWORK_NAME" != "${KG_RABBITMQ_CONTAINER_NAME}-network" ]]; then
            echo 'Refusing an invalid disposable RabbitMQ network name.'
            exit 1
          fi
          docker network create \
            --label "kg.test.sentinel=$KG_RABBITMQ_SENTINEL" \
            "$KG_RABBITMQ_NETWORK_NAME" >/dev/null
          docker run -d \
            --name "$KG_RABBITMQ_CONTAINER_NAME" \
            --network "$KG_RABBITMQ_NETWORK_NAME" \
            --label "kg.test.sentinel=$KG_RABBITMQ_SENTINEL" \
            -e "RABBITMQ_DEFAULT_USER=$KG_RABBITMQ_USER" \
            -e "RABBITMQ_DEFAULT_PASS=$KG_RABBITMQ_PASSWORD" \
            -p 127.0.0.1::5672 \
            --health-cmd 'rabbitmq-diagnostics -q ping' \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281 \
            >/dev/null
          for _ in $(seq 1 60); do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$KG_RABBITMQ_CONTAINER_NAME")" == 'healthy' ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$KG_RABBITMQ_CONTAINER_NAME")" != 'healthy' ]]; then
            echo 'Disposable RabbitMQ did not become healthy.'
            exit 1
          fi
          rabbit_port="$(docker port "$KG_RABBITMQ_CONTAINER_NAME" 5672/tcp | awk -F: '{print $NF}')"
          export rabbit_port
          python - <<'PY'
          import os
          from urllib.parse import quote

          broker_url = (
              f"amqp://{quote(os.environ['KG_RABBITMQ_USER'])}:"
              f"{quote(os.environ['KG_RABBITMQ_PASSWORD'])}@"
              f"127.0.0.1:{os.environ['rabbit_port']}//"
          )
          print(f"::add-mask::{broker_url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"KG_CELERY_BROKER_URL={broker_url}\n")
          PY

      - name: Create disposable test database
        shell: bash
        env:
          PGPASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_name="kg_it_${KG_TEST_RUN_ID}"
          if [[ "$KG_TEST_ENVIRONMENT" != "ci_ephemeral" || "$KG_DATABASE_NAME" != "$expected_name" ]]; then
            echo 'Refusing to create a database outside the current ephemeral test run.'
            exit 1
          fi
          createdb --host="$KG_DATABASE_HOST" --port="$KG_DATABASE_PORT" --username=postgres "$KG_DATABASE_NAME"
          psql \
            --host="$KG_DATABASE_HOST" \
            --port="$KG_DATABASE_PORT" \
            --username=postgres \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --set=database_name="$KG_DATABASE_NAME" \
            --set=sentinel="kg-test-disposable:${KG_TEST_RUN_ID}" <<'SQL'
          COMMENT ON DATABASE :"database_name" IS :'sentinel';
          SQL

      - name: Provision isolated validation roles
        shell: bash
        env:
          PGPASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          psql \
            --host="$KG_DATABASE_HOST" \
            --port="$KG_DATABASE_PORT" \
            --username=postgres \
            --dbname="$KG_DATABASE_NAME" \
            --set=ON_ERROR_STOP=1 \
            --set=database_name="$KG_DATABASE_NAME" \
            --set=outbox_database_name="$KG_OUTBOX_DATABASE_NAME" \
            --set=outbox_sentinel="kg-test-disposable:${KG_OUTBOX_TEST_RUN_ID}" \
            --set=ddl_owner_role="$KG_TEST_DDL_OWNER_ROLE" \
            --set=migration_role="$KG_TEST_MIGRATION_ROLE" \
            --set=application_role="$KG_TEST_APPLICATION_ROLE" \
            --set=application_password="$KG_DATABASE_PASSWORD" \
            --set=readonly_role="$KG_TEST_READONLY_ROLE" \
            --set=readonly_password="$KG_TEST_READONLY_ROLE_PASSWORD" \
            --set=writer_role="$KG_TEST_VERIFICATION_WRITER_ROLE" \
            --set=writer_password="$KG_TEST_VERIFICATION_WRITER_ROLE_PASSWORD" \
            --set=worker_role="$KG_TEST_DELIVERY_WORKER_ROLE" \
            --set=worker_password="$KG_TEST_DELIVERY_WORKER_ROLE_PASSWORD" \
            --set=audit_role="$KG_TEST_OUTBOX_AUDIT_ROLE" \
            --set=audit_password="$KG_TEST_OUTBOX_AUDIT_ROLE_PASSWORD" \
            --set=migration_password="$KG_TEST_MIGRATION_ROLE_PASSWORD" <<'SQL'
          CREATE ROLE :"ddl_owner_role" NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE :"migration_role" LOGIN PASSWORD :'migration_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE :"application_role" LOGIN PASSWORD :'application_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE :"readonly_role" LOGIN PASSWORD :'readonly_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE :"writer_role" LOGIN PASSWORD :'writer_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE :"worker_role" LOGIN PASSWORD :'worker_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE :"audit_role" LOGIN PASSWORD :'audit_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE EXTENSION IF NOT EXISTS timescaledb;
          ALTER DATABASE :"database_name" OWNER TO :"migration_role";
          ALTER SCHEMA public OWNER TO :"migration_role";
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          CREATE DATABASE :"outbox_database_name" OWNER :"ddl_owner_role";
          COMMENT ON DATABASE :"outbox_database_name" IS :'outbox_sentinel';
          GRANT :"ddl_owner_role" TO :"migration_role";
          ALTER ROLE :"migration_role" IN DATABASE :"outbox_database_name" SET role TO :"ddl_owner_role";
          SQL
          psql \
            --host="$KG_DATABASE_HOST" \
            --port="$KG_DATABASE_PORT" \
            --username=postgres \
            --dbname="$KG_OUTBOX_DATABASE_NAME" \
            --set=ON_ERROR_STOP=1 \
            --set=ddl_owner_role="$KG_TEST_DDL_OWNER_ROLE" <<'SQL'
          CREATE EXTENSION IF NOT EXISTS timescaledb;
          ALTER SCHEMA public OWNER TO :"ddl_owner_role";
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          SQL

      - name: Run PostgreSQL integration and migration tests
        run: >-
          python -m pytest tests/integration
          --ignore=tests/integration/test_身份注册持久发件箱数据库合同.py
          -q --junitxml=pytest-integration-report.xml

      - name: Run registration Celery worker bootstrap contract
        run: >-
          python -m pytest
          tests/test_身份注册编排器CeleryWorkerBootstrap合同.py::test_真实独立CeleryWorker进程Bootstrap与Beat
          -q --junitxml=pytest-registration-worker-report.xml

      - name: Apply Outbox Alembic head in controlled DDL-owner window
        run: |
          python - <<'PY'
          import os
          from alembic import command
          from tests.integration.conftest import _build_alembic_config

          command.upgrade(
              _build_alembic_config(
                  os.environ["KG_OUTBOX_KG_TEST_MIGRATION_DATABASE_URL"]
              ),
              "head",
          )
          PY

      - name: Close DDL-owner window and grant runtime permissions
        shell: bash
        env:
          PGPASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          psql \
            --host="$KG_DATABASE_HOST" \
            --port="$KG_DATABASE_PORT" \
            --username=postgres \
            --dbname="$KG_OUTBOX_DATABASE_NAME" \
            --set=ON_ERROR_STOP=1 \
            --set=database_name="$KG_OUTBOX_DATABASE_NAME" \
            --set=ddl_owner_role="$KG_TEST_DDL_OWNER_ROLE" \
            --set=migration_role="$KG_TEST_MIGRATION_ROLE" \
            --set=application_role="$KG_TEST_APPLICATION_ROLE" \
            --set=readonly_role="$KG_TEST_READONLY_ROLE" \
            --set=writer_role="$KG_TEST_VERIFICATION_WRITER_ROLE" \
            --set=worker_role="$KG_TEST_DELIVERY_WORKER_ROLE" \
            --set=audit_role="$KG_TEST_OUTBOX_AUDIT_ROLE" <<'SQL'
          ALTER ROLE :"migration_role" IN DATABASE :"database_name" RESET role;
          REVOKE :"ddl_owner_role" FROM :"migration_role";
          GRANT SELECT ON TABLE public.alembic_version TO :"migration_role";

          GRANT USAGE ON SCHEMA public TO :"application_role", :"readonly_role", :"writer_role", :"worker_role", :"audit_role";
          REVOKE CREATE ON SCHEMA public FROM :"application_role", :"readonly_role", :"writer_role", :"worker_role", :"audit_role";
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO :"application_role";
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO :"application_role";
          REVOKE UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE public.operation_log FROM :"application_role";
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO :"readonly_role";
          REVOKE INSERT, UPDATE, DELETE ON TABLE public.alembic_version FROM :"application_role";
          GRANT SELECT ON TABLE public.detection_report TO :"application_role", :"readonly_role";
          REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE public.detection_report FROM :"application_role", :"readonly_role";

          REVOKE ALL ON SCHEMA identity FROM PUBLIC;
          GRANT USAGE ON SCHEMA identity TO :"application_role", :"readonly_role";
          REVOKE CREATE ON SCHEMA identity FROM :"application_role", :"readonly_role";
          GRANT SELECT, INSERT, UPDATE ON TABLE identity.member TO :"application_role";
          REVOKE DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE identity.member FROM :"application_role";
          GRANT SELECT, INSERT ON TABLE identity.member_no_allocation, identity.user_member_self_link, identity.registration_bootstrap_record TO :"application_role";
          REVOKE UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE identity.member_no_allocation, identity.user_member_self_link, identity.registration_bootstrap_record FROM :"application_role";
          GRANT SELECT ON TABLE identity.member, identity.member_no_allocation, identity.user_member_self_link, identity.registration_bootstrap_record TO :"readonly_role";
          REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE identity.member, identity.member_no_allocation, identity.user_member_self_link, identity.registration_bootstrap_record FROM :"readonly_role";

          GRANT SELECT, INSERT ON TABLE public.identity_verification_decision, public.user_account_classification_decision, public.registration_eligibility_decision TO :"application_role";
          REVOKE UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE public.identity_verification_decision, public.user_account_classification_decision, public.registration_eligibility_decision FROM :"application_role";
          GRANT SELECT ON TABLE public.identity_verification_decision, public.user_account_classification_decision, public.registration_eligibility_decision TO :"readonly_role";
          REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE public.identity_verification_decision, public.user_account_classification_decision, public.registration_eligibility_decision FROM :"readonly_role";

          GRANT SELECT (id, role, status, verify_status, updated_at) ON TABLE public."user" TO :"writer_role", :"worker_role", :"audit_role";
          GRANT SELECT ON TABLE public.identity_verification_decision, public.user_account_classification_decision, public.registration_eligibility_decision, public.registration_verified_outbox TO :"writer_role", :"worker_role", :"audit_role";
          GRANT UPDATE (verify_status, updated_at) ON TABLE public."user" TO :"writer_role";
          GRANT INSERT ON TABLE public.identity_verification_decision, public.registration_eligibility_decision, public.registration_verified_outbox TO :"writer_role";
          GRANT INSERT ON TABLE public.registration_verified_outbox TO :"worker_role";
          GRANT UPDATE (status, available_at, attempt_count, lease_owner, locked_until, lease_generation, last_error_category, last_error_code, last_error_digest, delivered_at, updated_at) ON TABLE public.registration_verified_outbox TO :"worker_role";
          REVOKE ALL ON TABLE public.alembic_version FROM :"writer_role", :"worker_role", :"audit_role";
          REVOKE SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE public.registration_verified_outbox FROM :"application_role", :"readonly_role";
          GRANT SELECT, INSERT ON TABLE public.identity_verification_submission TO :"application_role";
          REVOKE UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE public.identity_verification_submission FROM :"application_role";
          GRANT SELECT ON TABLE public.identity_verification_submission TO :"readonly_role", :"writer_role", :"audit_role";
          GRANT UPDATE (status, decided_at, reviewed_by, decision_basis_code, evidence_digest, rejection_reason_code) ON TABLE public.identity_verification_submission TO :"writer_role";
          REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE public.identity_verification_submission FROM :"readonly_role", :"audit_role";
          SQL

      - name: Run Outbox steady-state PostgreSQL contract
        run: |
          export KG_TEST_SCHEMA_PREPARED=1
          export KG_TEST_RUN_ID="$KG_OUTBOX_TEST_RUN_ID"
          export KG_DATABASE_NAME="$KG_OUTBOX_DATABASE_NAME"
          export KG_TEST_DATABASE_URL="$KG_OUTBOX_KG_TEST_DATABASE_URL"
          export KG_TEST_MIGRATION_DATABASE_URL="$KG_OUTBOX_KG_TEST_MIGRATION_DATABASE_URL"
          export KG_TEST_READONLY_DATABASE_URL="$KG_OUTBOX_KG_TEST_READONLY_DATABASE_URL"
          export KG_TEST_VERIFICATION_WRITER_DATABASE_URL="$KG_OUTBOX_KG_TEST_VERIFICATION_WRITER_DATABASE_URL"
          export KG_TEST_DELIVERY_WORKER_DATABASE_URL="$KG_OUTBOX_KG_TEST_DELIVERY_WORKER_DATABASE_URL"
          export KG_TEST_OUTBOX_AUDIT_DATABASE_URL="$KG_OUTBOX_KG_TEST_OUTBOX_AUDIT_DATABASE_URL"
          python -m pytest \
            tests/integration/test_身份注册持久发件箱数据库合同.py::test_注册持久发件箱权限矩阵与真实往返 \
            -q --junitxml=pytest-outbox-steady-state-report.xml
          python -m pytest \
            tests/integration/test_身份注册持久发件箱数据库合同.py::test_注册持久发件箱R2权限并发恢复与对账真实往返 \
            -q --junitxml=pytest-outbox-r2-report.xml

      - name: Install pinned UUIDv7 validation candidate
        run: >-
          python -m pip install
          --only-binary=:all:
          --no-deps
          --require-hashes
          -r tests/uuid_validation/requirements-linux.txt

      - name: Run UUIDv7 library validation
        run: python -m pytest tests/uuid_validation -q --junitxml=pytest-uuid-validation-report.xml

      - name: Reject sensitive values in JUnit artifacts
        id: junit_sensitive_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          reports = sorted(Path(".").glob("pytest-*-report.xml"))
          forbidden_patterns = {
              "authorization": re.compile(r"(?i)\bBearer\s+[A-Za-z0-9._~-]+"),
              "jwt": re.compile(
                  r"\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b"
              ),
              "phone": re.compile(r"(?<!\d)1[3-9]\d{9}(?!\d)"),
              "identity_number": re.compile(r"(?<!\d)\d{17}[0-9Xx](?!\w)"),
              "database_or_broker_url": re.compile(
                  r"(?i)\b(?:postgresql(?:\+asyncpg)?|amqp)://"
              ),
          }
          exact_values = {
              "pii_kek": os.environ.get("KG_IDENTITY_PII_KEK_B64", ""),
              "pii_hmac": os.environ.get("KG_IDENTITY_PII_HMAC_KEY_B64", ""),
              "jwt_secret": os.environ.get("KG_JWT_SECRET_KEY", ""),
              "step_up_secret": os.environ.get("KG_IDENTITY_REVIEW_STEP_UP_SECRET_KEY", ""),
              "database_password": os.environ.get("KG_DATABASE_PASSWORD", ""),
              "rabbitmq_password": os.environ.get("KG_RABBITMQ_PASSWORD", ""),
              "test_password": "Secret12345",
          }
          findings = set()
          for report in reports:
              content = report.read_text(encoding="utf-8")
              findings.update(
                  label for label, pattern in forbidden_patterns.items()
                  if pattern.search(content)
              )
              findings.update(
                  label for label, value in exact_values.items()
                  if value and value in content
              )
          if findings:
              print("JUnit sensitive-data scan failed: " + ",".join(sorted(findings)))
              raise SystemExit(1)
          print(f"JUnit sensitive-data scan passed for {len(reports)} report(s).")
          PY

      - name: Upload integration test report
        if: always() && steps.junit_sensitive_scan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-integration-pytest-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/pytest-integration-report.xml
            backend/pytest-registration-worker-report.xml
            backend/pytest-outbox-steady-state-report.xml
            backend/pytest-outbox-r2-report.xml
            backend/pytest-uuid-validation-report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Stop and remove disposable RabbitMQ
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KG_RABBITMQ_CONTAINER_NAME:-}" || -z "${KG_RABBITMQ_NETWORK_NAME:-}" ]]; then
            exit 0
          fi
          if [[ ! "$KG_RABBITMQ_CONTAINER_NAME" =~ ^kg-reg-[0-9a-f]{12}$ ]]; then
            echo 'Refusing an invalid disposable RabbitMQ cleanup target.'
            exit 1
          fi
          if [[ "$KG_RABBITMQ_NETWORK_NAME" != "${KG_RABBITMQ_CONTAINER_NAME}-network" ]]; then
            echo 'Refusing an invalid disposable RabbitMQ network cleanup target.'
            exit 1
          fi
          cleanup_failed=0
          if docker inspect "$KG_RABBITMQ_CONTAINER_NAME" >/dev/null 2>&1; then
            actual_sentinel="$(docker inspect --format '{{index .Config.Labels "kg.test.sentinel"}}' "$KG_RABBITMQ_CONTAINER_NAME")"
            if [[ "$actual_sentinel" != "$KG_RABBITMQ_SENTINEL" ]]; then
              cleanup_failed=1
            fi
            docker stop "$KG_RABBITMQ_CONTAINER_NAME" >/dev/null || cleanup_failed=1
            docker rm "$KG_RABBITMQ_CONTAINER_NAME" >/dev/null || cleanup_failed=1
          fi
          if docker network inspect "$KG_RABBITMQ_NETWORK_NAME" >/dev/null 2>&1; then
            actual_network_sentinel="$(docker network inspect --format '{{index .Labels "kg.test.sentinel"}}' "$KG_RABBITMQ_NETWORK_NAME")"
            if [[ "$actual_network_sentinel" != "$KG_RABBITMQ_SENTINEL" ]]; then
              cleanup_failed=1
            else
              docker network rm "$KG_RABBITMQ_NETWORK_NAME" >/dev/null || cleanup_failed=1
            fi
          fi
          if docker inspect "$KG_RABBITMQ_CONTAINER_NAME" >/dev/null 2>&1; then
            cleanup_failed=1
          fi
          if docker network inspect "$KG_RABBITMQ_NETWORK_NAME" >/dev/null 2>&1; then
            cleanup_failed=1
          fi
          if [[ "$cleanup_failed" -ne 0 ]]; then
            echo 'Disposable RabbitMQ cleanup failed.'
            exit 1
          fi

      - name: Drop disposable Outbox test database
        if: always()
        shell: bash
        env:
          PGPASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_name="kg_it_${KG_OUTBOX_TEST_RUN_ID}"
          if [[ "$KG_TEST_ENVIRONMENT" != "ci_ephemeral" || "$KG_OUTBOX_DATABASE_NAME" != "$expected_name" ]]; then
            echo 'Refusing to drop an Outbox database outside the current ephemeral test run.'
            exit 1
          fi
          expected_sentinel="kg-test-disposable:${KG_OUTBOX_TEST_RUN_ID}"
          sentinel_matches="$(
            psql \
              --host="$KG_DATABASE_HOST" \
              --port="$KG_DATABASE_PORT" \
              --username=postgres \
              --dbname=postgres \
              --tuples-only \
              --no-align \
              --set=ON_ERROR_STOP=1 \
              --set=database_name="$KG_OUTBOX_DATABASE_NAME" \
              --set=expected_sentinel="$expected_sentinel" <<'SQL'
          SELECT CASE
          WHEN shobj_description(oid, 'pg_database') = :'expected_sentinel'
          THEN 'true'
          ELSE 'false'
          END
          FROM pg_database
          WHERE datname = :'database_name';
          SQL
          )"
          if [[ "$sentinel_matches" != "true" ]]; then
            echo 'Refusing to drop an Outbox database without the current disposable sentinel.'
            exit 1
          fi
          dropdb \
            --if-exists \
            --force \
            --host="$KG_DATABASE_HOST" \
            --port="$KG_DATABASE_PORT" \
            --username=postgres \
            "$KG_OUTBOX_DATABASE_NAME"

      - name: Drop disposable test database
        if: always()
        shell: bash
        env:
          PGPASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_name="kg_it_${KG_TEST_RUN_ID}"
          if [[ "$KG_TEST_ENVIRONMENT" != "ci_ephemeral" || "$KG_DATABASE_NAME" != "$expected_name" ]]; then
            echo 'Refusing to drop a database outside the current ephemeral test run.'
            exit 1
          fi
          expected_sentinel="kg-test-disposable:${KG_TEST_RUN_ID}"
          sentinel_matches="$(
            psql \
              --host="$KG_DATABASE_HOST" \
              --port="$KG_DATABASE_PORT" \
              --username=postgres \
              --dbname=postgres \
              --tuples-only \
              --no-align \
              --set=ON_ERROR_STOP=1 \
              --set=database_name="$KG_DATABASE_NAME" \
              --set=expected_sentinel="$expected_sentinel" <<'SQL'
          SELECT CASE
          WHEN shobj_description(oid, 'pg_database') = :'expected_sentinel'
          THEN 'true'
          ELSE 'false'
          END
          FROM pg_database
          WHERE datname = :'database_name';
          SQL
          )"
          if [[ "$sentinel_matches" != "true" ]]; then
            echo 'Refusing to drop a database without the current disposable sentinel.'
            exit 1
          fi
          dropdb \
            --if-exists \
            --force \
            --host="$KG_DATABASE_HOST" \
            --port="$KG_DATABASE_PORT" \
            --username=postgres \
            "$KG_DATABASE_NAME"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14
