name: P2 Foundation CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: p2-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject forbidden tracked artifacts
        shell: bash
        run: |
          forbidden="$({
            git ls-files | grep -Ei '(^|/)\.env($|\.)|\.(pem|key|p12|pfx|dump|backup|bak|sqlite|sqlite3|db)$|(^|/)(node_modules|dist|\.venv|__pycache__)(/|$)' || true
          })"
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Enforce deferred governance scripts
        shell: bash
        run: |
          if [[ -n "$(git ls-files 'scripts/**')" ]]; then
            echo 'Root governance scripts require a separate alignment review.'
            exit 1
          fi

      - name: Enforce blocked P2 decisions
        shell: bash
        run: |
          if git grep -I -n -E 'family_delegation|health_fact_correction|health_fact_supersession|therapist_assignment|professional_service_fulfillment' -- backend/app frontend/src; then
            echo 'Decision-003, Decision-008, or Decision-009 implementation detected.'
            exit 1
          fi

  backend-unit:
    name: Backend Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e . pytest==9.1.1

      - name: Generate process-only test secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"KG_DATABASE_PASSWORD={secrets.token_urlsafe(32)}\n")
              env_file.write(f"KG_JWT_SECRET_KEY={secrets.token_urlsafe(64)}\n")
              env_file.write("KG_RUN_PG_INTEGRATION=0\n")
          PY

      - name: Run non-database regression
        run: python -m pytest tests --ignore=tests/integration -q --junitxml=pytest-report.xml

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: warn
          retention-days: 14

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14
