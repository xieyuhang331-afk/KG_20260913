            exit 1
          fi
          if [[ -e "$RUNNER_TEMP/kg-slice7-worker.log" || -e "$RUNNER_TEMP/kg-slice7-ping.log" ]]; then
            echo 'Slice 7 worker logs remain after cleanup.'
            exit 1
          fi

