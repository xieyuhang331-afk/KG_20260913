          REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLE public.identity_verification_submission FROM :"readonly_role", :"audit_role";

          GRANT USAGE ON SCHEMA public TO :"fact_writer_role";
