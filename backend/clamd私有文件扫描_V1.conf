# S1 private-file scanner: the only reviewed clamd configuration.
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0

# The application accepts at most 10 MiB. Keep transport bounded but above it.
StreamMaxLength 11M
MaxFileSize 11M
MaxScanSize 12M
MaxRecursion 16
MaxFiles 1000
MaxScanTime 25000

# A partial, encrypted, or limit-exceeded inspection is never clean.
ScanArchive yes
ScanPDF yes
AlertEncrypted yes
AlertExceedsMax yes

# Bounded task-local concurrency.
MaxThreads 2
MaxQueue 8
CommandReadTimeout 2
ReadTimeout 35
SendBufTimeout 500
IdleTimeout 30
SelfCheck 600
ExitOnOOM yes

# No path/content/hash enrichment, retained temporary content, or event hook.
LogClean no
LogVerbose no
ExtendedDetectionInfo no
LeaveTemporaryFiles no
GenerateMetadataJson no
FollowFileSymlinks no
FollowDirectorySymlinks no
